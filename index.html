<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حضور المناديب</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--bd:#e3e6eb;--pri:#0b6b8a;--on:#fff;--ok:#1a7f4b;--bad:#c0392b;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2226;--tx:#eceff2;--mut:#98a2b3;--bd:#2d343a;--pri:#4cb3d4;--on:#0b1418;--ok:#4cc38a;--bad:#ff8a7a;--warn:#e7b04a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer;flex:1;min-width:90px}
button.sel,button.pri{background:var(--pri);color:var(--on);border-color:var(--pri)}
button.sm{flex:none;min-width:0;padding:4px 10px;font-size:13px}
button.link{border:0;background:none;color:var(--pri);flex:none;min-width:0;padding:4px}
button:disabled{opacity:.5}
input{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.msg{color:var(--mut);font-size:13px;margin-top:6px;min-height:18px}
.err{color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mut)}

:root{--info:#3b82f6;--mut2:#9aa5b1}
body{background:linear-gradient(160deg,#e3f2f8 0%,#efeafb 52%,#fdeee0 100%) fixed;min-height:100vh}
@media (prefers-color-scheme:dark){body{background:linear-gradient(160deg,#0d1a21 0%,#171329 52%,#211810 100%) fixed}}
.top{background:linear-gradient(135deg,#0b6b8a,#6a5acd);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(80,70,180,.25)}
.top h1,.top .sub{color:#fff}.top .sub{opacity:.9;margin-bottom:0}
.top button{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.45)}
button.sel,button.pri{background:linear-gradient(135deg,#0b6b8a,#6a5acd);color:#fff;border-color:transparent}
.card{box-shadow:0 2px 10px rgba(30,40,80,.08)}
.stat{border-top:4px solid #6a5acd;box-shadow:0 2px 10px rgba(30,40,80,.08)}
.stat:nth-child(2n){border-top-color:#0b6b8a}.stat:nth-child(3n){border-top-color:#e0a030}
.an h2{margin-bottom:14px}
.anwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;position:relative;flex:none}
.hole{position:absolute;inset:22px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hole b{font-size:24px}.hole span{font-size:11px;color:var(--mut)}
.legend{flex:1;min-width:210px}
.lg{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.lg i{width:12px;height:12px;border-radius:50%;flex:none}.lg span{flex:1}
.bar{margin-top:12px}.barh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.track{height:10px;border-radius:99px;background:var(--bd);overflow:hidden}.fill{height:100%;border-radius:99px;transition:width .4s}

/* ===== تصميم لوحة التحكم الداكنة ===== */
:root{--bg:#0b1520;--side:#0d1b29;--card:#112133;--bd:#1d3247;--tx:#e6edf5;--mut:#8ea3b8;--pri:#2f7bff;--on:#fff;--ok:#22c55e;--bad:#f04438;--warn:#f5a524;--info:#38bdf8;--mut2:#64748b}
:root[data-theme="light"]{--bg:#f2f5f9;--side:#ffffff;--card:#ffffff;--bd:#dfe6ee;--tx:#14212e;--mut:#5d7086;--pri:#1d6bff;--ok:#15803d;--bad:#d92d20;--warn:#b7791f;--info:#0284c7;--mut2:#94a3b8}
body{background:var(--bg);min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:18px;width:100%}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex:none;background:var(--side);border-inline-end:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;padding:6px 8px 18px;font-size:16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;padding:11px 12px;border-radius:10px;color:var(--mut);min-width:0;flex:none;justify-content:flex-start}
.nav:hover{background:var(--bd);color:var(--tx)}.nav.on{background:var(--bd);color:var(--tx);font-weight:600}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--side);position:sticky;top:0;z-index:10}
.topbar .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;padding:0;min-width:0;flex:none;display:flex;align-items:center;justify-content:center}
.user{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.3}.user small{display:block;color:var(--mut);font-size:11px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.shell.auth .side,.shell.auth .topbar{display:none}
.shell.auth #app{max-width:440px;margin:6vh auto}
.ham,.bk{display:none}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pico{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--pri) 18%,transparent);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.pagehead h1{margin:0}.pagehead .sub{margin:0}
.band{background:linear-gradient(90deg,#1646b8,#1d63e8);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
h2{border-inline-start:4px solid var(--pri);padding-inline-start:10px;line-height:1.3}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:none}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat,.stat:nth-child(n){border:1px solid var(--bd);border-top:1px solid var(--bd);box-shadow:none;border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:right}
.stat b{font-size:28px;line-height:1.1}.stat span{font-size:12px;color:var(--mut)}
.sico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
button.sel,button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.top{background:none;box-shadow:none;padding:0;border-radius:0}.top h1{color:var(--tx)}.top .sub{color:var(--mut);opacity:1}
.top button{background:var(--card);color:var(--tx);border-color:var(--bd)}
th{background:color-mix(in srgb,var(--bd) 45%,transparent)}
#app>input[type=date]{max-width:260px}
@media (max-width:900px){
  .ham{display:flex}
  .side{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:30;transform:translateX(100%);transition:transform .25s;height:100%;box-shadow:0 0 30px rgba(0,0,0,.4)}
  .side.open{transform:none}
  .bk.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  #app{padding:14px}
}
</style>
</head>
<body>
<div class="shell auth" id="shell">
<aside class="side" id="side"></aside>
<div class="mainc"><div class="topbar" id="topbar"></div><main id="app"><p class="sub">جاري التحميل…</p></main></div>
</div>
<div class="bk" id="bk"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendEmailVerification,sendPasswordResetEmail,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const fb=initializeApp({
  apiKey:"AIzaSyCvLvPjnXCnwenVZazbrBlLza3ZqpQRWCs",
  authDomain:"follow-up-fd860.firebaseapp.com",
  projectId:"follow-up-fd860",
  storageBucket:"follow-up-fd860.firebasestorage.app",
  messagingSenderId:"561000150460",
  appId:"1:561000150460:web:a793168c90f312d94ce7b9"
});
const auth=getAuth(fb),db=getFirestore(fb);
const ADMIN="azamabdellatif87@gmail.com";
const app=document.getElementById('app'),shell=document.getElementById('shell'),bkEl=document.getElementById('bk');
try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
function closeSide(){const sd=document.getElementById('side');sd&&sd.classList.remove('open');bkEl.classList.remove('show')}
bkEl.onclick=closeSide;
function setActive(k){document.querySelectorAll('#side .nav').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function setShell(u,role){
  if(!role){shell.className='shell auth';return}
  shell.className='shell';
  const side=document.getElementById('side'),tb=document.getElementById('topbar');side.textContent='';tb.textContent='';
  const br=el('div','brand');br.appendChild(el('div','logo','📋'));br.appendChild(el('span','','متابعة المناديب'));side.appendChild(br);
  const items=role==='admin'?[['dash','🏠','لوحة التحكم',()=>adminView(u)],['report','📊','تقرير فترة',()=>reportView(u)],['cmp','📁','مقارنة بملف Excel',()=>compareView(u)]]
    :role==='rep'?[['today','📝','تسجيل اليوم',()=>repView(u)],['acct','🗂️','حسابي وسجلاتي',()=>accountView(u.uid,u.displayName||u.email,()=>repView(u))]]:[];
  items.forEach(i=>{const b=el('button','nav');b.dataset.k=i[0];b.appendChild(el('span','',i[1]));b.appendChild(el('span','',i[2]));b.onclick=()=>{closeSide();i[3]()};side.appendChild(b)});
  const lo=el('button','nav');lo.style.marginTop='auto';lo.appendChild(el('span','','🚪'));lo.appendChild(el('span','','تسجيل الخروج'));lo.onclick=()=>signOut(auth);side.appendChild(lo);
  const hb=el('button','ib ham','☰');hb.onclick=()=>{side.classList.toggle('open');bkEl.classList.toggle('show')};tb.appendChild(hb);
  tb.appendChild(el('div','sp'));
  const th=el('button','ib','🌓');th.onclick=()=>{const d=document.documentElement,nx=d.dataset.theme==='light'?'dark':'light';d.dataset.theme=nx;try{localStorage.setItem('theme',nx)}catch(e){}};tb.appendChild(th);
  const nm=u.displayName||u.email||'',us=el('div','user'),inf=el('div');
  inf.appendChild(el('div','',nm));inf.appendChild(el('small','',role==='admin'?'مشرف':role==='rep'?'مندوب':'مشرف'));
  us.appendChild(el('div','avatar',nm.trim().charAt(0).toUpperCase()));us.appendChild(inf);tb.appendChild(us)}
const ST={present:'حاضر',absent:'غايب',off:'إجازة'};
const ERR={'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/invalid-login-credentials':'الإيميل أو الباسورد غلط','auth/email-already-in-use':'الإيميل ده مسجل قبل كده، سجل دخول','auth/weak-password':'الباسورد لازم يكون 6 حروف أو أرقام على الأقل','auth/invalid-email':'الإيميل مكتوب غلط','auth/missing-password':'اكتب الباسورد','auth/too-many-requests':'محاولات كتير، استنى شوية وجرب تاني'};
let unsubs=[],registering=false;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function iso(d){const m=d.getMonth()+1,k=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(k<10?'0':'')+k}
const today=iso(new Date());
function clear(){unsubs.forEach(f=>f());unsubs=[];app.textContent=''}
function header(title,sub){const t=el('div','pagehead'),l=el('div');t.appendChild(el('div','pico','📋'));l.appendChild(el('h1','',title));l.appendChild(el('div','sub',sub));t.appendChild(l);app.appendChild(t)}
function iconFor(lbl){
  const M=[['إجمالي','👥','var(--pri)'],['مناديب','👥','var(--pri)'],['مطابق','✔️','var(--ok)'],['زيادة','➕','var(--info)'],['ناقص','⚠️','var(--bad)'],['غياب','❌','var(--bad)'],['غايب','❌','var(--bad)'],['أيدل','⏸️','var(--warn)'],['إجازة','🏖️','var(--info)'],['إجازات','🏖️','var(--info)'],['سلف','💰','var(--warn)'],['أنهى','🏁','var(--ok)'],['أنهوا','🏁','var(--ok)'],['حضور','✅','var(--ok)'],['حضروا','✅','var(--ok)'],['حضر','✅','var(--ok)']];
  return M.find(x=>lbl.includes(x[0]))||['','📊','var(--pri)']}
function statCard(lbl,val){
  const m=iconFor(lbl),c=el('div','stat'),i=el('div','sinfo'),b=el('b','',val);b.style.color=m[2];i.appendChild(b);i.appendChild(el('span','',lbl));
  const ic=el('div','sico',m[1]);ic.style.background='color-mix(in srgb,'+m[2]+' 18%,transparent)';c.appendChild(i);c.appendChild(ic);return c}

/* ---------- تسجيل الدخول ---------- */
function authView(mode){
  clear();mode=mode||'login';
  app.appendChild(el('h1','','حضور المناديب'));
  app.appendChild(el('div','sub',mode==='login'?'سجل دخول بإيميلك':'اعمل حساب جديد بإيميلك'));
  const c=el('div','card'),name=el('input'),em=el('input'),pw=el('input'),msg=el('div','msg err');
  name.placeholder='الاسم بالكامل';em.type='email';em.placeholder='الإيميل (Gmail أو Outlook أو أي إيميل)';em.dir='ltr';pw.type='password';pw.placeholder='الباسورد (6 على الأقل)';pw.dir='ltr';
  if(mode==='register')c.appendChild(name);c.appendChild(em);c.appendChild(pw);
  const go=el('button','pri',mode==='login'?'دخول':'إنشاء حساب');
  go.onclick=async()=>{
    msg.textContent='';go.disabled=true;
    try{
      if(mode==='login'){await signInWithEmailAndPassword(auth,em.value.trim(),pw.value)}
      else{
        if(!name.value.trim()){msg.textContent='اكتب اسمك';go.disabled=false;return}
        registering=true;
        const r=await createUserWithEmailAndPassword(auth,em.value.trim(),pw.value);
        await updateProfile(r.user,{displayName:name.value.trim()});
        await setDoc(doc(db,'users',r.user.uid),{name:name.value.trim(),email:r.user.email});
        try{await sendEmailVerification(r.user)}catch(e){}
        registering=false;route(auth.currentUser);
      }
    }catch(e){registering=false;msg.textContent=ERR[e.code]||('حصل خطأ: '+(e.code||e.message))}
    go.disabled=false;
  };
  c.appendChild(go);c.appendChild(msg);
  const sw=el('button','link',mode==='login'?'معنديش حساب؟ سجل دلوقتي':'عندي حساب؟ سجل دخول');sw.onclick=()=>authView(mode==='login'?'register':'login');c.appendChild(sw);
  if(mode==='login'){const f=el('button','link','نسيت الباسورد');f.onclick=async()=>{if(!em.value.trim()){msg.textContent='اكتب الإيميل الأول';return}try{await sendPasswordResetEmail(auth,em.value.trim());msg.className='msg';msg.textContent='بعتنالك رابط تغيير الباسورد على الإيميل'}catch(e){msg.textContent=ERR[e.code]||'حصل خطأ'}};c.appendChild(f)}
  app.appendChild(c);
}


/* ---------- كشف حساب مندوب ---------- */
async function accountView(uid,name,back){
  clear();setActive('acct');
  const top=el('div','top'),l=el('div');l.appendChild(el('h1','','حساب: '+(name||'')));l.appendChild(el('div','sub','كل الأيام اللي اتسجلت'));
  top.appendChild(l);const bb=el('button','sm','رجوع');bb.onclick=back;top.appendChild(bb);app.appendChild(top);
  const box=el('p','sub','جاري التحميل…');app.appendChild(box);
  let rows=[];
  try{const s=await getDocs(query(collection(db,'records'),where('uid','==',uid)));rows=s.docs.map(d=>d.data())}
  catch(e){box.textContent='مقدرتش أقرأ السجل: '+(e.code||'');return}
  rows.sort((a,b)=>a.date<b.date?1:-1);box.remove();
  const n={present:0,absent:0,off:0,idle:0,ended:0,appr:0,pend:0,rej:0};
  rows.forEach(r=>{if(r.idle)n.idle++;else if(r.status)n[r.status]++;if(r.ended)n.ended++;
    if(r.advance>0){if(r.advanceStatus==='approved')n.appr+=r.advance;else if(r.advanceStatus==='rejected')n.rej+=r.advance;else n.pend+=r.advance}});
  const st=el('div','stats');
  [['أيام حضور',n.present],['أيام أيدل',n.idle],['أيام غياب',n.absent],['إجازات',n.off],['أيام أنهى فيها العمل',n.ended],['سلف موافق عليها',n.appr],['سلف منتظرة',n.pend]].forEach(x=>st.appendChild(statCard(x[0],x[1])));
  app.appendChild(st);
  const c=el('div','card scroll'),t=el('table'),h=el('tr');
  ['التاريخ','الحالة','سلفة','إنهاء العمل'].forEach(x=>h.appendChild(el('th','',x)));t.appendChild(h);
  if(!rows.length){const e=el('tr'),td=el('td','','مفيش سجلات لسه.');td.colSpan=4;e.appendChild(td);t.appendChild(e)}
  rows.forEach(r=>{const tr=el('tr');
    tr.appendChild(el('td','',r.date));
    tr.appendChild(el('td',r.idle?'warn':r.status==='present'?'ok':r.status==='absent'?'bad':'warn',r.idle?'أيدل':(ST[r.status]||'—')));
    const a=r.advance>0?r.advance+' ('+(r.advanceStatus==='approved'?'موافق':r.advanceStatus==='rejected'?'مرفوض':'منتظر')+')':'—';
    tr.appendChild(el('td',r.advance>0?(r.advanceStatus==='approved'?'ok':r.advanceStatus==='rejected'?'bad':'warn'):'',a));
    tr.appendChild(el('td',r.ended?'ok':'',r.ended?'خلّص':'—'));
    t.appendChild(tr)});
  c.appendChild(t);app.appendChild(c);
}

/* ---------- شاشة المندوب ---------- */
async function repView(u){
  clear();setActive('today');
  const ref=doc(db,'records',u.uid+'_'+today);let rec={},wantAdv=false;
  try{const s=await getDoc(ref);if(s.exists())rec=s.data()}catch(e){}
  const msg=el('div','msg');
  async function save(p){
    Object.assign(rec,p);msg.textContent='جاري الحفظ…';
    try{await setDoc(ref,{...p,uid:u.uid,name:u.displayName||u.email,email:u.email,date:today},{merge:true});msg.textContent='اتحفظ ✓'}
    catch(e){msg.textContent='ما اتحفظش، جرب تاني'}
    draw();
  }
  function group(title,opts,key,cur){
    const c=el('div','card');c.appendChild(el('h2','',title));const r=el('div','row');
    opts.forEach(o=>{const b=el('button',cur===o[0]?'sel':'',o[1]);b.onclick=()=>save({[key]:o[0]});r.appendChild(b)});
    c.appendChild(r);return c}
  function draw(){
    app.textContent='';
    header('أهلاً '+(u.displayName||''),'تسجيل يوم '+today);
    if(rec.idle){const nt=el('div','card','تم تسجيلك «أيدل» النهاردة: حضرت لكن مفيش شغل متاح من العمليات.');nt.style.borderColor='var(--warn)';app.appendChild(nt)}
    app.appendChild(group('حالتك النهاردة',[['present','حاضر'],['absent','غايب'],['off','إجازة']],'status',rec.status));
    app.appendChild(group('هتيجي بكرا؟',[['yes','أيوه جاي'],['no','لأ مش جاي']],'tomorrow',rec.tomorrow));
    const a=el('div','card');a.appendChild(el('h2','','سلفة'));const yn=el('div','row');
    const has=rec.advance>0||wantAdv;

/* ---------- مقارنة مع ملف Excel ---------- */
function parseCsv(t){const rows=[];let row=[],cur='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){row.push(cur);cur=''}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows}
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc)})}
function toDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return null}
async function readSheet(file){
  let arr;
  if(/\.csv$/i.test(file.name))arr=parseCsv(new TextDecoder('utf-8').decode(await file.arrayBuffer()));
  else{
    try{await loadXlsx()}catch(e){throw new Error('مقدرتش أحمّل مكتبة Excel. احفظ الملف CSV وارفعه.')}
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    arr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  }
  const h=arr.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=2);
  if(h<0)throw new Error('مش لاقي أعمدة في الملف.');
  return {headers:arr[h].map((x,i)=>String(x).trim()||('عمود '+(i+1))),rows:arr.slice(h+1).filter(r=>r.some(c=>String(c).trim()!==''))}}

const WD={'سبت':6,'احد':0,'اثنين':1,'اتنين':1,'ثلاثاء':2,'تلات':2,'ثلاثا':2,'اربعاء':3,'اربع':3,'خميس':4,'جمعه':5,'sat':6,'sun':0,'mon':1,'tue':2,'wed':3,'thu':4,'fri':5};
function numFrom(v){if(typeof v==='number')return v;const s=String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();const m=s.match(/\d+(\.\d+)?/);return m?parseFloat(m[0]):null}
function offDays(v){const set=new Set();
  const d=(v instanceof Date||(typeof v==='number'&&v>20000)||typeof v==='string')?toDate(v):null;
  if(d){set.add(new Date(d+'T12:00:00').getDay());return set}
  String(v==null?'':v).split(/[^A-Za-z\u0600-\u06FF]+/).forEach(w=>{let t=norm(w);if(!t)return;
    if(/^[a-z]+$/.test(t))t=t.slice(0,3);else t=t.replace(/^و/,'').replace(/^ال/,'');
    if(WD[t]!==undefined)set.add(WD[t])});
  return set}

      sheet.headers.forEach((h,i)=>{const o=document.createElement('option');o.value=i;o.textContent=h;s.appendChild(o)});s.value=String(def);c.appendChild(w);w.appendChild(s);return s}
    let ci=sheet.headers.findIndex(h=>{const n=norm(h);return n.includes('عدد')&&(n.includes('ايام')||n.includes('حضور')||n.includes('يوم'))});
    if(ci<0)ci=find(['ايام','days','عدد']);
    sN=sel('عمود اسم المندوب',find(['اسم','name','مندوب']));
    sE=sel('عمود الإيميل (لو موجود)',find(['mail','ايميل','بريد']));
    sC=sel('عمود عدد أيام الحضور في الشيت',ci);
    sO=sel('عمود يوم الإجازة في الشيت',find(['اجازه','راحه','off']));
    c.appendChild(el('div','sub','اختار الأسبوع اللي الشيت بتاعه:'));
    const w0=weekStart(today),r=el('div','row');pf=dateInput(w0);pt=dateInput(addDays(w0,6));r.appendChild(pf);r.appendChild(pt);c.appendChild(r);
    const q=el('div','row');q.style.marginTop='8px';
    [['الأسبوع ده',w0,addDays(w0,6)],['الأسبوع اللي فات',addDays(w0,-7),addDays(w0,-1)]].forEach(x=>{const b=el('button','sm',x[0]);b.onclick=()=>{pf.value=x[1];pt.value=x[2]};q.appendChild(b)});c.appendChild(q);
    const go=el('button','pri','قارن');go.style.cssText+='width:100%;margin-top:10px';go.onclick=run;c.appendChild(go);cfg.appendChild(c)}
  async function run(){
    const ni=+sN.value,ei=+sE.value,ci=+sC.value,oi=+sO.value;
    if(ni<0&&ei<0){out.textContent='اختار عمود الاسم أو الإيميل.';return}
    if(ci<0&&oi<0){out.textContent='اختار عمود عدد الأيام أو عمود يوم الإجازة.';return}
    if(!pf.value||!pt.value||pf.value>pt.value){out.textContent='اختار فترة صحيحة.';return}
    out.textContent='جاري المقارنة…';
    const from=pf.value,to=pt.value,dates=daysBetween(from,to);let data;
    try{data=await loadPeriod(from,to)}catch(e){out.textContent='مقدرتش أقرأ البيانات: '+(e.code||'');return}
    const byE={},byN={};
    Object.keys(data.users).forEach(id=>{const v=data.users[id];if(v.email)byE[v.email.toLowerCase()]=id;const k=norm(v.name);if(k)byN[k]=(byN[k]===undefined?id:null)});
    const rows=[],unm=new Set(),seen=new Set();let noNum=0,noOff=0,dup=0;
    sheet.rows.forEach(r=>{
      const nm=ni>=0?String(r[ni]==null?'':r[ni]).trim():'',em=ei>=0?String(r[ei]==null?'':r[ei]).trim().toLowerCase():'';if(!nm&&!em)return;
      const uid=(em&&byE[em])||(nm&&byN[norm(nm)])||null;
      if(!uid){unm.add(nm||em);return}
      if(seen.has(uid)){dup++;return}seen.add(uid);
      const planned=ci>=0?numFrom(r[ci]):null;if(ci>=0&&planned==null)noNum++;
      const off=oi>=0?offDays(r[oi]):new Set();if(oi>=0&&!off.size&&String(r[oi]==null?'':r[oi]).trim()!=='')noOff++;
      const c={present:0,idle:0,absent:0,off:0,none:0};let onOff=0,noneWork=0;
      dates.forEach(d=>{const k=catOf(data.recs[uid+'_'+d]),wd=new Date(d+'T12:00:00').getDay();c[k]++;
        if((k==='present'||k==='idle')&&off.has(wd))onOff++;
        if(k==='none'&&!off.has(wd))noneWork++});
      const att=c.present+c.idle,expect=planned!=null?planned:Math.max(0,dates.length-off.size),diff=att-expect,un=data.users[uid];
      rows.push({name:un.name||un.email,off:off.size?Array.from(off).sort((x,y)=>x-y).map(i=>WDN[i]).join('، '):'—',expect:expect,att:att,idle:c.idle,absent:c.absent,sysOff:c.off,noneWork:noneWork,onOff:onOff,diff:diff,
        pc:expect?pct(att,expect):(att?100:0),st:diff===0?'مطابق':diff<0?'ناقص '+(-diff):'زيادة '+diff})});
    out.textContent='';
    if(unm.size||noNum||noOff||dup){const w=el('div','card');w.style.borderColor='var(--warn)';
      if(unm.size)w.appendChild(el('div','',unm.size+' من الشيت ملقيتهمش في السيستم (لازم يعملوا حساب بنفس الاسم أو الإيميل)، ومش محسوبين: '+Array.from(unm).slice(0,15).join('، ')+(unm.size>15?' …':'')));
      if(noNum)w.appendChild(el('div','msg',noNum+' مندوب عدد أيامه في الشيت مش رقم، واتحسبله (أيام الأسبوع ناقص أيام الإجازة).'));
      if(noOff)w.appendChild(el('div','msg',noOff+' مندوب يوم إجازته مش مفهوم (المفروض اسم يوم زي الجمعة أو تاريخ).'));
      if(dup)w.appendChild(el('div','msg',dup+' صف مكرر لنفس المندوب واتتجاهل.'));out.appendChild(w)}
    if(!rows.length){out.appendChild(el('p','sub','مفيش ولا مندوب من الشيت اتطابق مع حسابات السيستم.'));return}
    const sum=k=>rows.reduce((a,x)=>a+x[k],0),E=sum('expect'),A=sum('att'),I=sum('idle'),short=rows.reduce((a,x)=>a+Math.max(0,x.expect-x.att),0),cov=E-short;
    const st=el('div','stats');
    [['مناديب في الشيت',rows.length],['مطابق',rows.filter(x=>x.diff===0).length],['ناقص عن الشيت',rows.filter(x=>x.diff<0).length],['زيادة عن الشيت',rows.filter(x=>x.diff>0).length],['حضروا يوم إجازتهم',rows.filter(x=>x.onOff>0).length]].forEach(x=>st.appendChild(statCard(x[0],x[1])));
    out.appendChild(st);
    breakdown(out,'نتيجة المقارنة ('+from+' إلى '+to+')',[['حضور مطابق للشيت',cov,'var(--ok)'],['نقص عن الشيت (غياب)',short,'var(--bad)']],pct(cov,E),'نسبة الحضور',
      [['حضور السيستم ÷ أيام الشيت',pct(A,E),'var(--ok)'],['نسبة النقص (الغياب)',pct(short,E),'var(--bad)'],['نسبة الأيدل من حضور السيستم',pct(I,A),'var(--warn)']]);
    out.appendChild(el('div','msg','النسب = مجموع أيام الحضور في السيستم ÷ مجموع أيام الشيت ('+A+' ÷ '+E+'). الأيدل محسوب حضور.'));
    rows.sort((x,y)=>x.diff-y.diff||(x.name>y.name?1:-1));
    const H=['المندوب','يوم الإجازة (شيت)','أيام الشيت','حضور السيستم','منهم أيدل','غياب مسجل','إجازة مسجلة','أيام شغل ماسجلش فيها','حضر يوم إجازته','الفرق','نسبة الحضور','الحالة'];
    const R=rows.map(x=>[x.name,x.off,x.expect,x.att,x.idle,x.absent,x.sysOff,x.noneWork,x.onOff,x.diff,x.pc,x.st]);
    tableCard(out,'حسب المندوب (الناقصين أولاً)',H,R.map(r=>r.slice(0,10).concat([r[10]+'%',r[11]])));
    const ex=el('button','','تصدير النتيجة Excel (CSV)');ex.style.width='100%';ex.onclick=()=>csvSave('مقارنة-'+from+'_'+to+'.csv',[H].concat(R));out.appendChild(ex);
  }
}

/* ---------- الإيميل ما اتفعلش (للمشرف) ---------- */
function verifyView(u){
  clear();header('تفعيل إيميل المشرف',u.email);
  const c=el('div','card');c.appendChild(el('p','','عشان تفتح لوحة المتابعة لازم تفعّل إيميلك: افتح الإيميل واضغط على رابط التفعيل اللي اتبعتلك، وبعدين اضغط الزرار تحت.'));
  const r=el('button','pri','فعّلت، افتح اللوحة'),s=el('button','','ابعتلي رابط التفعيل تاني'),m=el('div','msg');
  r.onclick=async()=>{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);route(auth.currentUser)};
  s.onclick=async()=>{try{await sendEmailVerification(auth.currentUser);m.textContent='اتبعت، شوف الإيميل (وفولدر السبام)'}catch(e){m.textContent='استنى شوية وجرب تاني'}};
  c.appendChild(r);c.appendChild(s);c.appendChild(m);app.appendChild(c);
}

function route(u){
  if(!u){setShell(null);return authView()}
  const isA=(u.email||'').toLowerCase()===ADMIN;
  if(isA&&!u.emailVerified){setShell(u,'verify');return verifyView(u)}
  setShell(u,isA?'admin':'rep');
  return isA?adminView(u):repView(u)}
onAuthStateChanged(auth,u=>{if(!registering)route(u)});
</script>
