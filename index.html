  items.forEach(i=>{const b=el('button','nav');b.dataset.k=i[0];b.appendChild(el('span','',i[1]));b.appendChild(el('span','',i[2]));b.onclick=()=>{closeSide();i[3]()};side.appendChild(b)});

  const nm=u.displayName||ME.name||u.email||'',us=el('div','user'),inf=el('div');

  topAv=avatarEl(ME.photo,nm,34);us.appendChild(topAv);us.appendChild(inf);

const ST={present:'حاضر',absent:'غايب',off:'إجازة'};
const ERR={'auth/invalid-credential':'الإيميل أو الباسورد غلط','auth/invalid-login-credentials':'الإيميل أو الباسورد غلط','auth/email-already-in-use':'الإيميل ده مسجل قبل كده، سجل دخول','auth/weak-password':'الباسورد لازم يكون 6 حروف أو أرقام على الأقل','auth/invalid-email':'الإيميل مكتوب غلط','auth/missing-password':'اكتب الباسورد','auth/too-many-requests':'محاولات كتير، استنى شوية وجرب تاني'};
let unsubs=[],registering=false;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function iso(d){const m=d.getMonth()+1,k=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(k<10?'0':'')+k}
const today=iso(new Date());
function clear(){unsubs.forEach(f=>f());unsubs=[];app.textContent=''}

function iconFor(lbl){
  const M=[['إجمالي','👥','var(--pri)'],['منتور','🛡️','var(--info)'],['مناديب','👥','var(--pri)'],['مطابق','✔️','var(--ok)'],['زيادة','➕','var(--info)'],['ناقص','⚠️','var(--bad)'],['غياب','❌','var(--bad)'],['غايب','❌','var(--bad)'],['أيدل','⏸️','var(--warn)'],['إجازة','🏖️','var(--info)'],['إجازات','🏖️','var(--info)'],['سلف','💰','var(--warn)'],['أنهى','🏁','var(--ok)'],['أنهوا','🏁','var(--ok)'],['حضور','✅','var(--ok)'],['حضروا','✅','var(--ok)'],['حضر','✅','var(--ok)']];

/* ---------- المحطات والصور ---------- */
const STATIONS=['DAI3','DAI4','DRO5','DAI7'];
const SELCSS='width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px';
let ME={},topAv=null;
function stOf(v){const x=v&&String(v.station||'').trim().toUpperCase();return STATIONS.includes(x)?x:'غير محدد'}
function avatarEl(photo,name,sz){const a=el('div','avatar');if(sz){a.style.width=a.style.height=sz+'px';a.style.fontSize=Math.round(sz/2.4)+'px'}
  if(photo){const i=document.createElement('img');i.src=photo;i.alt='';a.appendChild(i)}else a.textContent=String(name||'?').trim().charAt(0).toUpperCase();return a}
function pickPhoto(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const S=160,c=document.createElement('canvas');c.width=c.height=S;const m=Math.min(im.width,im.height);

function waLink(phone,text){let d=String(phone||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='20'+d.slice(1);else if(d.length===10&&d[0]==='1')d='20'+d;return d?'https://wa.me/'+d+'?text='+encodeURIComponent(text):''}

function pickImage(max,q,sq){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');let sx=0,sy=0,sw=im.width,sh=im.height;

function parseCsv(t){const rows=[];let row=[],cur='',q=false;t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;else if(ch===','||ch===';'||ch==='\t'){row.push(cur);cur=''}
    else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}
  if(cur!==''||row.length){row.push(cur);rows.push(row)}return rows}
function loadXlsx(){return new Promise((res,rej)=>{if(window.XLSX)return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=res;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc)})}
function toDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*3600e3));
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return null}
async function readSheet(file){
  let arr;
  if(/\.csv$/i.test(file.name))arr=parseCsv(new TextDecoder('utf-8').decode(await file.arrayBuffer()));
  else{
    try{await loadXlsx()}catch(e){throw new Error('مقدرتش أحمّل مكتبة Excel. احفظ الملف CSV وارفعه.')}
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    arr=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
  }
  const h=arr.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=2);
  if(h<0)throw new Error('مش لاقي أعمدة في الملف.');
  return {headers:arr[h].map((x,i)=>String(x).trim()||('عمود '+(i+1))),rows:arr.slice(h+1).filter(r=>r.some(c=>String(c).trim()!==''))}}

const WDN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WD={'سبت':6,'احد':0,'اثنين':1,'اتنين':1,'ثلاثاء':2,'تلات':2,'ثلاثا':2,'اربعاء':3,'اربع':3,'خميس':4,'جمعه':5,'sat':6,'sun':0,'mon':1,'tue':2,'wed':3,'thu':4,'fri':5};

function offDays(v){const set=new Set();
  const d=(v instanceof Date||(typeof v==='number'&&v>20000)||typeof v==='string')?toDate(v):null;
  if(d){set.add(new Date(d+'T12:00:00').getDay());return set}
  String(v==null?'':v).split(/[^A-Za-z\u0600-\u06FF]+/).forEach(w=>{let t=norm(w);if(!t)return;
    if(/^[a-z]+$/.test(t))t=t.slice(0,3);else t=t.replace(/^و/,'').replace(/^ال/,'');
    if(WD[t]!==undefined)set.add(WD[t])});

async function readSheets(file){
  const out=[];
  if(/\.csv$/i.test(file.name))out.push({name:'CSV',start:0,arr:parseCsv(new TextDecoder('utf-8').decode(await file.arrayBuffer()))});
  else{

async function route(u){
  if(location.hash==='#jobs'){setShell(null);shell.className='shell auth pub';return jobsPublic(u)}
  if(!u){setShell(null);return authView()}
  const isA=(u.email||'').toLowerCase()===ADMIN;
  try{const sd=await getDoc(doc(db,'users',u.uid));ME=sd.exists()?sd.data():{}}catch(e){ME={}}
  if(isA&&!u.emailVerified){setShell(u,'verify');return verifyView(u)}
  setShell(u,isA?'admin':'rep');
  return isA?adminView(u):repView(u)}
window.addEventListener('hashchange',()=>route(auth.currentUser));
onAuthStateChanged(auth,u=>{if(!registering)route(u)});
